<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario registro ofertas</title>
    <link rel="stylesheet" th:href="@{/css/estilolista.css}">
</head>

<body>
    <div class="container">
        <header>
            <h1>Formulario servicio</h1>
        </header>

        <section>
            <div class="campo1">
                <h2>Servicio</h2>
                <a th:href="@{/}" class="volver">← Volver al inicio</a>
            </div>

            <div class="campo2">
                <form th:action="@{/guardarservicio}" th:object="${servicio}" method="post">
                    <input type="hidden" th:field="*{codigo}" />

                    <div class="form-group">
                        <label>Descripción</label>
                        <input type="text" th:field="*{descripcion}" placeholder="Ingrese descripción de la oferta" />
                        <span class="error" th:if="${#fields.hasErrors('descripcion')}"
                            th:errors="*{descripcion}"></span>
                    </div>

                    <div class="form-group">
                        <label>Fecha de creación</label>
                        <input type="date" th:field="*{fechacreacion}" placeholder="YYYY-MM-DD" />
                        <span class="error" th:if="${#fields.hasErrors('fechacreacion')}"
                            th:errors="*{fechacreacion}"></span>
                    </div>

                    <div class="form-group">
                        <label>Valor comercial</label>
                        <input type="text" th:field="*{valorunitario}"
                            placeholder="Ingrese la condición comercial" />
                        <span class="error" th:if="${#fields.hasErrors('valorunitario')}"
                            th:errors="*{valorunitario}"></span>
                    </div>

                    <div class="form-actions">
                        <input type="submit" value="Guardar" />
                    </div>
                </form>
            </div>
        </section>
    </div>
</body>

</html>
