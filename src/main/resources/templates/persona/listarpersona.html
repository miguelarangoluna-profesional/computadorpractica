<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <title>Lista de persona</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </head>
    <body>
        <div class="container">
            <h1>Listar persona</h1>
            <div class="acciones-superiores">
                <a th:text="${'Agregar persona'}" th:href="@{/addpersona}"></a>
                <a th:href="@{/}">Volver</a>
                <a th:href="@{/imprimirreporte}" th:text="${'IMPRIMIR REPORTE'}"></a>  
            </div>

            <hr/>
            
            <p th:text="|Condiones: ${condiciones}|"></p>
            <p th:text="|Forma de pago: ${formadepago}|"></p>
            <p th:text="|Empleado: ${empleado}|"></p>
            <label><strong>Total esta oferta: $ </strong></label><p th:text="${#numbers.formatDecimal(total,0,'POINT',1,'COMMA')}"></p>
            <div th:if="${listapersona != null and !listapersona.empty}">
                <table border="1">
                    <thead>
                        <tr>
                            <th>Ítem</th>
                            <th>Codigo oferta</th>
                            <th>Descripcion</th>
                            <th>Valor total</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="detalleofertaservicio,contador : ${listapersona}">
                            <td data-label="Ítem" th:text="${contador.count}"></td>
                            <td data-label="Ítem" th:text="${detalleofertaservicio.codigo}"></td>
                            <td data-label="Razón Social" th:text="${detalleofertaservicio?.servicio?.descripcion}"></td>
                            <td th:text="|$ ${#numbers.formatDecimal(detalleofertaservicio?.valortotal,0,'POINT',2,'COMMA')}|"></td>
                            <td data-label="Acciones">
                                <a th:href="@{'/eliminarcliente/' + ${detalleofertaservicio.codigo}}"
                                   onclick="return confirm('¿Está seguro de eliminar este empleado?')">Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${listapersona == null or listapersona.empty}" class="vacio">
                <p>La lista de personas se encuentra vacía</p>
            </div>
        </div>
    </body>
</html>
