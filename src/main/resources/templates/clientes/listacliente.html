<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Clientes</title>
    <link rel="stylesheet" th:href="@{/css/estilolistaclientes.css}">
</head>

<body>
    <div class="container">
        <h1>Lista de Clientes</h1>

        <div class="acciones-superiores">
            <a th:text="${'Agregar cliente'}" th:href="@{/addcliente}">Agregar cliente</a>
            <a th:href="@{/}">Volver</a>
        </div>

        <div th:if="${listacliente != null and !listacliente.empty}">
            <table>
                <thead>
                    <tr>
                        <th>Ítem</th>
                        <th>Razón Social</th>
                        <th>NIT</th>
                        <th>Contacto</th>
                        <th>Dirección</th>
                        <th>Correo</th>
                        <th>Celular</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cli : ${listacliente}">
                        <td data-label="Ítem" th:text="${cli.codigo}"></td>
                        <td data-label="Razón Social" th:text="${cli.razonsocial}"></td>
                        <td data-label="NIT" th:text="${cli.nit}"></td>
                        <td data-label="Contacto" th:text="${cli.contacto}"></td>
                        <td data-label="Dirección" th:text="${cli.direccion}"></td>
                        <td data-label="Correo" th:text="${cli.correo}"></td>
                        <td data-label="Celular" th:text="${cli.celular}"></td>
                        <td data-label="Acciones">
                            <a th:href="@{'/editarcliente/' + ${cli.codigo}}">Modificar</a>
                            <a th:href="@{'/eliminarcliente/' + ${cli.codigo}}"
                               onclick="return confirm('¿Está seguro de eliminar este cliente?')">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${listacliente == null or listacliente.empty}" class="vacio">
            <p>La lista de clientes se encuentra vacía</p>
        </div>
    </div>
</body>

</html>
